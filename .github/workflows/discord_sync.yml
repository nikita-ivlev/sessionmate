name: Discord sync

# #bugs posts in Discord -> issues here; issue status -> post tags in Discord (ops/discord/issues.py).
# The bot code is a copy of ops/discord from the code repo: change it there, then copy it here.

on:
  schedule:
    - cron: "*/15 * * * *"   # new #bugs posts
  issues:
    types: [closed, reopened, labeled]   # status back to Discord right away
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04   # Python 3.12: tomllib, no pip install
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sync #bugs and issues
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then echo "DISCORD_BOT_TOKEN is not set: skipped"; exit 0; fi
          python3 -m ops.discord sync-issues
