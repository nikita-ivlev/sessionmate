# --- pinned guides at the top of each forum (one pinned post per forum) ---------------------------

[[forum_post]]
channel = "bugs"
title = "Start here: how to report a bug"
pinned = true
text = """
**How to post a bug — 1 minute**
1. **Search first.** Same bug here? 👍 it and add your details.
2. **Title:** what broke, in a few words. *Kit search finds nothing*
3. **Tag it:** 📦 installer · 🔌 fl-connection · 💬 chat · 🥁 samples · 💥 crash · 🐢 performance
4. **Write:** what you did → what happened → what you expected. Your FL Studio and Windows version.
5. **Attach the logs:** Sessionmate window → **Settings → Diagnostics → Collect report → Show in folder** → drag `support_diagnostics_bundle.json` into your post. No API key inside. The window does not open? A screenshot instead.

We set the status: 🔍 confirmed → 🔧 fixed-in-next → ✅ fixed, with the version in a reply. A confirmed bug gives you {@bug-hunter}.
Each post also becomes a public GitHub issue: your first message's text only. Setup questions: {#help}."""

[[forum_post]]
channel = "ideas"
title = "Start here: how to share an idea"
pinned = true
text = """
**Got an idea for Sessionmate? This is the place.**
1. **Search first.** If the idea is here, add 👍 and how you would use it: votes decide what comes next.
2. **One post = one idea.** Say what you want to do in FL Studio and why it matters for your music.

**What happens next**
• Tags show the status: 📅 planned, ✅ done, 💤 not-now.
• Planned ideas go to {#roadmap}, next to what we already build.
• An idea in the plan gives you the {@idea-maker} role."""

# --- pinned FAQ in #help (facts from the public README) ------------------------------------------

[[forum_post]]
channel = "help"
title = "Start here: FAQ"
pinned = true
tags = ["install"]
text = """
**Windows says "Windows protected your PC".** The installer is not code-signed yet. Click **More info → Run anyway**. You can check the SHA-256 from the release page first.
**Setup asks for administrator rights.** That is loopMIDI, the virtual MIDI port Sessionmate uses. Once.
**Setup does not go on after the model page.** It goes on only when the model answers: click **Check**. Free: Z.ai, Groq, or Ollama on your PC (16 GB RAM, 8 GB GPU).
**No "Sessionmate" in FL's plugin list.** Options → Manage plugins → Find installed plugins. Then add it as an effect on the Master track of the Mixer.
**FL does not react to requests.** Options → MIDI settings: input `fl-mcp` is on, controller type "Test Controller", port 77.
**The sample folder does not work.** It must be on an NTFS drive: not a USB stick, not a network drive. Restart FL once after the first sort.
**Something else broke.** Settings → Diagnostics → Collect report, then post in {#bugs} with the file.
Known limitations: <https://github.com/nikita-ivlev/sessionmate/blob/main/KNOWN_LIMITATIONS.md>"""

# --- AutoMod: blocks the message and tells #mod-log; never bans, never times out ------------------

[[automod]]
name = "No piracy"
trigger = "keyword"
keywords = ["crack", "cracked", "keygen*", "*torrent*", "warez", "nulled", "repack", "serial key", "activation key"]
message = "No piracy here: no cracks, keygens or torrents. Rule 3 in the welcome channel."
alert = "mod-log"
exempt_roles = ["Team"]

[[automod]]
name = "No invites to other servers"
trigger = "keyword"
regex = ['discord(?:\.gg|(?:app)?\.com/invite)/\S+']   # Rust regex: no lookahead; Team may post invites
message = "No invites to other servers, please."
alert = "mod-log"
exempt_roles = ["Team"]

[[automod]]
name = "Block spam"
trigger = "spam"
alert = "mod-log"

[[automod]]
name = "Block Mention Spam"
trigger = "mention_spam"
mention_limit = 5
raid_protection = true
message = "Too many mentions in one message."
alert = "mod-log"
exempt_roles = ["Team"]

[[automod]]
name = "Slurs and sexual content"
trigger = "preset"
presets = ["slurs", "sexual"]
alert = "mod-log"
